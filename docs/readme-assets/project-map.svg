<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 32px; font-weight: 800; letter-spacing: 4px; }
    .subtitle { fill: #94a3b8; font-size: 14px; font-weight: 500; letter-spacing: 2px; }
    .body { fill: #cbd5e1; font-size: 13px; }
    .highlight { fill: #38bdf8; font-weight: 600; }
    .card-title { fill: #f8fafc; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-stat { fill: url(#green-glow); font-size: 12px; font-weight: 800; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 4; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Lines -->
  <path d="M400,40 L400,80" class="edge-glow" />
  <path d="M400,80 L250,80 L250,110" class="edge" />
  <path d="M400,80 L550,80 L550,110" class="edge" />
  
  <path d="M250,150 L250,180" class="edge" />
  <path d="M250,180 L150,180 L150,210" class="edge" />
  <path d="M250,180 L250,210" class="edge" />
  <path d="M250,180 L350,180 L350,210" class="edge" />

  <!-- Root -->
  <rect x="300" y="20" width="200" height="40" fill="#312e81" stroke="#4f46e5" rx="8" />
  <text x="400" y="45" class="node-text">AKASHIC LIBRARY</text>

  <!-- Branches -->
  <rect x="150" y="110" width="200" height="40" fill="#064e3b" stroke="#10b981" rx="8" />
  <text x="250" y="135" class="node-text">DJANGO CORE</text>

  <rect x="450" y="110" width="200" height="40" fill="#0f172a" stroke="#64748b" rx="8" />
  <text x="550" y="135" class="node-text">REACT FRONTEND (NEXT)</text>

  <!-- Apps -->
  <rect x="100" y="210" width="100" height="30" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="150" y="230" class="node-text" font-size="10px">ACCOUNTS</text>

  <rect x="220" y="210" width="100" height="30" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="270" y="230" class="node-text" font-size="10px">DISCOVERY</text>

  <rect x="340" y="210" width="100" height="30" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="390" y="230" class="node-text" font-size="10px">COMMUNITY</text>
  
  <rect x="160" y="250" width="80" height="30" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="200" y="270" class="node-text" font-size="10px">STORE</text>

  <rect x="260" y="250" width="80" height="30" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="300" y="270" class="node-text" font-size="10px">ORDERS</text>

</svg>