<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 32px; font-weight: 800; letter-spacing: 4px; }
    .subtitle { fill: #94a3b8; font-size: 14px; font-weight: 500; letter-spacing: 2px; }
    .body { fill: #cbd5e1; font-size: 13px; }
    .highlight { fill: #38bdf8; font-weight: 600; }
    .card-title { fill: #f8fafc; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-stat { fill: url(#green-glow); font-size: 12px; font-weight: 800; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 4; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Subtle network background -->
  <path d="M100,50 L200,150 L400,80 L600,160 L750,40" stroke="#334155" stroke-width="1" fill="none" opacity="0.5" />
  <circle cx="100" cy="50" r="3" fill="#475569" />
  <circle cx="200" cy="150" r="3" fill="#475569" />
  <circle cx="400" cy="80" r="3" fill="#475569" />
  <circle cx="600" cy="160" r="3" fill="#475569" />
  <circle cx="750" cy="40" r="3" fill="#475569" />

  <text x="400" y="85" text-anchor="middle" class="title" filter="url(#neon)">✦ AKASHIC LIBRARY ✦</text>
  <text x="400" y="120" text-anchor="middle" class="subtitle">A UNIFIED DIGITAL ECOSYSTEM</text>
  <text x="400" y="145" text-anchor="middle" class="body">Discover · Read · Connect · Shop</text>
</svg>