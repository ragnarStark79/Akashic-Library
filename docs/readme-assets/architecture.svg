<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 20px; font-weight: 800; letter-spacing: 2px; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .sub-text { fill: #94a3b8; font-size: 10px; font-weight: 500; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
    .edge-dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
    .arrow { fill: #475569; }
    .arrow-glow { fill: #38bdf8; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Connections -->
  <path d="M400,60 L400,100" class="edge-glow" marker-end="url(#arrow-glow)" />
  <path d="M400,140 L400,180" class="edge-glow" marker-end="url(#arrow-glow)" />
  
  <path d="M400,220 L250,220 L250,260" class="edge" />
  <path d="M400,220 L400,260" class="edge" />
  <path d="M400,220 L550,220 L550,260" class="edge" />

  <path d="M250,300 L250,340" class="edge" />
  <path d="M400,300 L400,340" class="edge" />
  <path d="M550,300 L550,340" class="edge" />

  <!-- External Providers -->
  <path d="M120,280 L200,280" class="edge-dash" />
  <rect x="20" y="260" width="100" height="40" fill="url(#card-bg)" stroke="#64748b" rx="4" />
  <text x="70" y="285" class="sub-text">External Providers</text>

  <!-- Nodes -->
  <!-- User -->
  <circle cx="400" cy="30" r="20" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="2" />
  <circle cx="400" cy="25" r="6" fill="#38bdf8" />
  <path d="M390,40 C 390,30 410,30 410,40" stroke="#38bdf8" stroke-width="2" fill="none" />

  <!-- React -->
  <rect x="300" y="100" width="200" height="40" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" rx="8" />
  <text x="400" y="125" class="node-text">REACT FRONTEND</text>

  <!-- Django -->
  <rect x="300" y="180" width="200" height="40" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="8" />
  <text x="400" y="205" class="node-text">DJANGO REST API</text>

  <!-- Domains -->
  <rect x="200" y="260" width="100" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="250" y="285" class="node-text">DISCOVERY</text>

  <rect x="350" y="260" width="100" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="400" y="285" class="node-text">ACCOUNTS</text>

  <rect x="500" y="260" width="100" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="4" />
  <text x="550" y="285" class="node-text">COMMERCE</text>

  <!-- DBs -->
  <rect x="180" y="340" width="140" height="40" fill="#065f46" stroke="#10b981" rx="8" />
  <text x="250" y="365" class="node-text">MongoDB</text>

  <rect x="330" y="340" width="140" height="40" fill="#1e3a8a" stroke="#3b82f6" rx="8" />
  <text x="400" y="365" class="node-text">PostgreSQL</text>

  <rect x="480" y="340" width="140" height="40" fill="#1e3a8a" stroke="#3b82f6" rx="8" />
  <text x="550" y="365" class="node-text">PostgreSQL</text>

  <!-- Annotations -->
  <text x="460" y="85" class="sub-text">HTTPS</text>
  <text x="460" y="165" class="sub-text">REST / JSON</text>
</svg>