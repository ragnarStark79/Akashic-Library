<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <path d="M400,40 L400,80" class="edge" />
  <path d="M400,120 L400,160" class="edge" />
  <path d="M400,200 L400,240" class="edge-glow" />
  <path d="M400,280 L400,320" class="edge-glow" />

  <!-- Nodes -->
  <rect x="300" y="0" width="200" height="40" fill="#0ea5e9" rx="8" />
  <text x="400" y="25" class="node-text">USER AUTHENTICATION</text>

  <rect x="300" y="80" width="200" height="40" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" rx="8" />
  <text x="400" y="105" class="node-text">REACT LOGIN REQUEST</text>

  <rect x="300" y="160" width="200" height="40" fill="#064e3b" stroke="#10b981" rx="8" />
  <text x="400" y="185" class="node-text">DJANGO AUTH API</text>

  <rect x="300" y="240" width="200" height="40" fill="#6366f1" rx="8" />
  <text x="400" y="265" class="node-text">SESSION SET-COOKIE</text>

  <rect x="300" y="320" width="200" height="40" fill="#065f46" stroke="#10b981" rx="8" />
  <text x="400" y="345" class="node-text">CSRF PROTECTED REQUESTS</text>

</svg>