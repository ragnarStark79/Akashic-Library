<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 20px; font-weight: 800; letter-spacing: 2px; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .sub-text { fill: #94a3b8; font-size: 10px; font-weight: 500; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
    .edge-dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
    .arrow { fill: #475569; }
    .arrow-glow { fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Frontend Block -->
  <rect x="50" y="40" width="700" height="120" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" rx="8" />
  <text x="400" y="65" class="title" fill="#38bdf8">REACT FRONTEND (VITE)</text>
  
  <rect x="100" y="90" width="120" height="40" fill="#0f172a" stroke="#475569" rx="4" />
  <text x="160" y="115" class="node-text">Components</text>
  
  <rect x="250" y="90" width="120" height="40" fill="#0f172a" stroke="#475569" rx="4" />
  <text x="310" y="115" class="node-text">Hooks / Context</text>
  
  <rect x="400" y="90" width="120" height="40" fill="#0f172a" stroke="#475569" rx="4" />
  <text x="460" y="115" class="node-text">Pages / Routes</text>
  
  <rect x="550" y="90" width="120" height="40" fill="#0f172a" stroke="#475569" rx="4" />
  <text x="610" y="115" class="node-text">API Client</text>

  <!-- Boundary -->
  <path d="M0,200 L800,200" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8" />
  <text x="400" y="195" class="sub-text" fill="#f43f5e" font-weight="700">API BOUNDARY (HTTP / JSON)</text>
  
  <path d="M400,160 L400,240" stroke="#f43f5e" stroke-width="3" fill="none" />

  <!-- Backend Block -->
  <rect x="50" y="240" width="700" height="120" fill="url(#card-bg)" stroke="#10b981" stroke-width="2" rx="8" />
  <text x="400" y="265" class="title" fill="#10b981">DJANGO BACKEND</text>

  <rect x="100" y="290" width="120" height="40" fill="#064e3b" stroke="#047857" rx="4" />
  <text x="160" y="315" class="node-text">Authentication</text>
  
  <rect x="250" y="290" width="120" height="40" fill="#064e3b" stroke="#047857" rx="4" />
  <text x="310" y="315" class="node-text">REST APIs</text>
  
  <rect x="400" y="290" width="120" height="40" fill="#064e3b" stroke="#047857" rx="4" />
  <text x="460" y="315" class="node-text">Business Logic</text>
  
  <rect x="550" y="290" width="120" height="40" fill="#064e3b" stroke="#047857" rx="4" />
  <text x="610" y="315" class="node-text">Data Access</text>

</svg>