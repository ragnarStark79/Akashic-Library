<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 32px; font-weight: 800; letter-spacing: 4px; }
    .subtitle { fill: #94a3b8; font-size: 14px; font-weight: 500; letter-spacing: 2px; }
    .body { fill: #cbd5e1; font-size: 13px; }
    .highlight { fill: #38bdf8; font-weight: 600; }
    .card-title { fill: #f8fafc; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-stat { fill: url(#green-glow); font-size: 12px; font-weight: 800; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 4; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <path d="M400,60 L400,120" class="edge-glow" />
  <path d="M400,120 L200,120 L200,170" class="edge" />
  <path d="M400,120 L400,170" class="edge" />
  <path d="M400,120 L600,120 L600,170" class="edge" />
  <path d="M200,210 L200,240 L400,240 L400,270" class="edge" />
  <path d="M400,210 L400,240" class="edge" />
  <path d="M600,210 L600,240 L400,240" class="edge" />

  <!-- Nodes -->
  <rect x="320" y="20" width="160" height="40" fill="#0ea5e9" rx="20" />
  <text x="400" y="45" class="node-text">DISCOVERY</text>

  <rect x="120" y="170" width="160" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="8" />
  <text x="200" y="195" class="node-text">PERSONAL LIBRARY</text>

  <rect x="320" y="170" width="160" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="8" />
  <text x="400" y="195" class="node-text">COMMUNITY</text>

  <rect x="520" y="170" width="160" height="40" fill="url(#card-bg)" stroke="#38bdf8" rx="8" />
  <text x="600" y="195" class="node-text">STORE &amp; CART</text>

  <rect x="320" y="250" width="160" height="40" fill="#6366f1" rx="20" />
  <text x="400" y="275" class="node-text">IDENTITY</text>
</svg>