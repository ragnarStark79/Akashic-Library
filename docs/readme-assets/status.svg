<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: url(#glow); font-size: 32px; font-weight: 800; letter-spacing: 4px; }
    .subtitle { fill: #94a3b8; font-size: 14px; font-weight: 500; letter-spacing: 2px; }
    .body { fill: #cbd5e1; font-size: 13px; }
    .highlight { fill: #38bdf8; font-weight: 600; }
    .card-title { fill: #f8fafc; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-stat { fill: url(#green-glow); font-size: 12px; font-weight: 800; }
    .node-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 4; }
    .edge-glow { stroke: url(#glow); stroke-width: 2; fill: none; }
  </style>

  <!-- Backend -->
  <rect x="20" y="20" width="175" height="80" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1" rx="8" />
  <text x="35" y="45" class="card-title">BACKEND</text>
  <text x="180" y="45" text-anchor="end" class="card-stat">● COMPLETE</text>
  <text x="35" y="70" class="body">Django + DRF</text>
  
  <!-- Discovery -->
  <rect x="215" y="20" width="175" height="80" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1" rx="8" />
  <text x="230" y="45" class="card-title">DISCOVERY</text>
  <text x="375" y="45" text-anchor="end" class="card-stat">● COMPLETE</text>
  <text x="230" y="70" class="body">Multi-provider logic</text>
  
  <!-- Testing -->
  <rect x="410" y="20" width="175" height="80" fill="url(#card-bg)" stroke="#10b981" stroke-width="1" rx="8" />
  <text x="425" y="45" class="card-title">TESTING</text>
  <text x="570" y="45" text-anchor="end" class="card-stat">341 / 341</text>
  <text x="425" y="70" class="body">All tests passing</text>
  
  <!-- Frontend -->
  <rect x="605" y="20" width="175" height="80" fill="url(#card-bg)" stroke="#64748b" stroke-width="1" rx="8" />
  <text x="620" y="45" class="card-title">FRONTEND</text>
  <text x="765" y="45" text-anchor="end" fill="#94a3b8" font-size="12px" font-weight="800">◌ NEXT</text>
  <text x="620" y="70" class="body">React + Vite</text>
</svg>